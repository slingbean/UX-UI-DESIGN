<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A typography study exploring how typefaces communicate mood.">
    <title>Perspective | Modern</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <header class="page-header">
            <span>01 | MODERN</span>
            <span class="header-symbol" aria-hidden="true">&#10061;</span>
        </header>

        <section class="content">
            <div class="editorial-layout">
                
            <h1 class="perspective" aria-label="PERSPECTIVE">
                <span class="word-row row-one" aria-hidden="true">
                    P<span class="italic">E</span>R
                </span>
                <span class="word-row row-two" aria-hidden="true">
                    S<span class="italic">P</span>EC
                </span>
                <span class="word-row row-three" aria-hidden="true">
                    T<span class="italic">I</span>VE
                </span>
            </h1>
            <div class="accent-line" aria-hidden="true"></div>
            <p class="editorial-caption">
                <span>The way we see things</span>
                <span>changes everything.</span>
            </p>
        </section>

        <footer class="page-footer">
            <span>A TYPOGRAPHIC STUDY</span>
            <span>01 - 05</span>
        </footer>
    </main>
</body>

</html>
