<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A professional typography study inspired by traditional newspaper design.">

    <title>Perspective | Professional Typography</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">

        <header class="publication-header">
            <div class="publication-details">
                <span>VOL. III | NO. 03</span>
                <span>THE TYPOGRAPHIC STUDY</span>
                <span>EST. MMXXVI</span>
            </div>

            <div class="double-rule" aria-hidden="true"></div>
        </header>

        <section class="feature" aria-labelledby="feature-title">
            <p class="feature-label">AN EXAMINATION OF THE WAY WE SEE</p>

            <h1 id="feature-title">PERSPECTIVE</h1>

            <div class="ornament" aria-hidden="true">
                <span class="ornament-line"></span>
                <span class="ornament-symbol">&#10022;</span>
                <span class="ornament-line"></span>
            </div>

            <p class="feature-subtitle">
                The way we see changes everything.
            </p>
        </section>

        <footer class="publication-footer">
            <div class="footer-rule" aria-hidden="true"></div>

            <div class="footer-details">
                <span>FORM &amp; FUNCTION</span>
                <span>TYPE &amp; TRADITION</span>
                <span>03 - 05</span>
            </div>
        </footer>

    </main>
</body>

</html>
