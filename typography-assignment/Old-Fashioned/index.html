<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="An old-fashioned typography study inspired by original 1984 Macintosh interface.">
        <title>Perspective | Old-Fashioned</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <main class="desktop">

            <!-- Macintosh Menu Bar -->
             <header class="menu-bar">
                <span class="command-logo" aria-label="Command logo">&#8984;</span>
                <nav aria-label="Classic Macitosh menu">
                    <span>File</span>
                    <span>Edit</span>
                    <span>View</span>
                    <span>Special</span>
                </nav>
             </header>

             <!-- Macintosh Window -->
              <section class="mac-window" arialabelledby="window-heading">

                <div class="window-titlebar">
                    <span class="close-box" aria-hidden="true"></span>
                    <span class="title-stripes" aria-hidden="true"></span>
                    <span class="window-title">Perspective</span>
                    <span class="title-stripes" aria-hidden="true"></span>
                </div>

                <div class="window-info">
                    <span>1 item</span>
                    <span>1984 Macintosh</span>
                    <span>04 / 05</span>
                </div>

                <div class="window-body">
                    <div class="window-content">
                        <h1 id="window-heading">PERSPECTIVE</h1>
                        <p>The way we see things<br>changes everything.</p>
                    </div>

                    <div class="vertical-scroll" aria-hidden="true">
                        <span class="scroll-arrow up"></span>
                        <span class="scroll-track"></span>
                        <span class="scroll-arrow down"></span>
                    </div>
                </div>

                <div class="window-bottom" aria-hidden="true">
                    <span class="bottom-arrow left"></span>
                    <span class="bottom-track"></span>
                    <span class="bottom-arrow right"></span>
                    <span class="resize-box"></span>
                </div>
                </section>
        </main>
    </body>
</html>
