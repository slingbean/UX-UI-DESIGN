<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Electric Daydream - a playful typography study exploring perspective.">
    <title>Perspective | Goofy</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">

        <header class="page-header">
            <span>02 | GOOFY</span>
            <svg class="eye" viewBox="0 0 80 65" aria-hidden="true" focusable="false">
                <path d="M7 34 C6 14 23 8 40 9 C64 7 75 23 72 38 C68 57 19 60 7 34Z" fill="#FFF9F0" stroke="#202A3B"
                    stroke-width="2.5" />
                <ellipse cx="49" cy="35" rx="12" ry="14" fill="#202A3B" />
                <circle cx="53" cy="29" r="4" fill="#FFF9F0" />
            </svg>
        </header>

        <!-- Main Typography -->
        <section class="content">

            <h1 class="perspective" aria-label="PERSPECTIVE">
                <span class="letter-row row-one" aria-hidden="true">
                    <span class="letter pink">P</span>
                    <span class="letter yellow">E</span>
                    <span class="letter cream">R</span>
                </span>

                <span class="letter-row row-two" aria-hidden="true">
                    <span class="letter yellow">S</span>
                    <span class="letter cream">P</span>
                    <span class="letter pink">E</span>
                    <span class="letter yellow">C</span>
                </span>

                <span class="letter-row row-three" aria-hidden="true">
                    <span class="letter cream">T</span>
                    <span class="letter pink">I</span>
                    <span class="letter yellow">V</span>
                    <span class="letter cream">E</span>
                </span>
            </h1>

            <div class="accent-line" aria-hidden="true"></div>
            <p>The way we see things changes everything.</p>

        </section>

        <!-- Footer -->
        <footer class="page-footer">
            <span>A TYPOGRAPHIC STUDY</span>
            <span>02 - 05</span>
        </footer>

    </main>
</body>

</html>
