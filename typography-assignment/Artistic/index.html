<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perspective | Artistic</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!--StyleSheet -->
    <link href="style.css" rel="stylesheet"/>
</head>

<body>
    <main class="poster">

        <!-- Main Artwork-->
         <section class="composition" aria-labelledby="title">

            <!-- Decorative Shapes -->
             <div class="circle" aria-hidden="true"></div>
             <div class="rectangle" aria-hidden="true"></div>
             <div class="small-circle" aria-hidden="true"></div>

             <!-- Typography -->
              <h1 id="title" class="perspective">
                <span class="line-one">PERS</span>
                <span class="line-two">PEC</span>
                <span class="line-three">TIVE</span>
              </h1>

              <!-- Supporting Text -->
               <p class="caption">
                The way we see things<br>
                changes everything.
               </p>

         </section>

         <!-- Poster Footer -->
          <footer class="poster-footer">
            <span>EXPERIMENTAL TYPOGRAPHY</span>
            <span>05 - 05</span>
          </footer>
          
    </main>
</body>
