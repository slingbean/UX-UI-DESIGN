<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LOW TIDE | Coastal Journal</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header id="home" class="site-header">
        <nav class="navbar navbar-expand-md">
            <div class="container-fluid site-container">

                <a class="navbar-brand" href="#home">LOW TIDE</a>

                <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavigation"
                    aria-controls="mainNavigation"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="mainNavigation">

                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link" href="#home">HOME</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#explore">EXPLORE</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#about">ABOUT</a>
                        </li>

                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>

        <!-- HERO -->
        <section class="hero" aria-labelledby="hero-title">

            <img
                src="images/hero.jpeg"
                alt="A person overlooking a stormy Pacific coastline"
                class="hero-photo"
            >

            <div class="hero-overlay">

                <h1 id="hero-title">
                    Somewhere Between<br>
                    Land &amp; Sea
                </h1>

                <div class="hero-subtitle">
                    <span class="accent-line"></span>
                    <p>A journal of coastal places and slower days.</p>
                </div>

            </div>

        </section>

        <!-- EXPLORE -->
        <section id="explore" class="explore-section">

            <div class="container-fluid site-container">

                <div class="section-heading">
                    <h2>EXPLORE THE COAST</h2>
                    <p>Three places worth slowing down for.</p>
                </div>

                <div class="row g-4 destination-grid">

                    <!-- TOFINO -->
                    <div class="col-12 col-md-4">
                        <article class="destination-card">

                            <img
                                src="images/tofino.jpg"
                                alt="Aerial view of ocean waves meeting a forested coastline"
                                class="destination-photo"
                            >

                            <div class="destination-info">
                                <h3>TOFINO</h3>
                                <span aria-hidden="true">→</span>
                            </div>

                        </article>
                    </div>

                    <!-- OREGON COAST -->
                    <div class="col-12 col-md-4">
                        <article class="destination-card">

                            <img
                                src="images/oregon-coast.jpg"
                                alt="Rocky Oregon coastline with evergreen trees"
                                class="destination-photo"
                            >

                            <div class="destination-info">
                                <h3>OREGON COAST</h3>
                                <span aria-hidden="true">→</span>
                            </div>

                        </article>
                    </div>

                    <!-- BIG SUR -->
                    <div class="col-12 col-md-4">
                        <article class="destination-card">

                            <img
                                src="images/big-sur.jpg"
                                alt="Golden coastal cliffs overlooking the Pacific Ocean"
                                class="destination-photo"
                            >

                            <div class="destination-info">
                                <h3>BIG SUR</h3>
                                <span aria-hidden="true">→</span>
                            </div>

                        </article>
                    </div>

                </div>
            </div>
        </section>

        <!-- FOOTER / ABOUT -->
        <footer id="about" class="site-footer">

            <div class="container-fluid site-container">

                <div class="footer-content">

                    <span class="footer-brand">LOW TIDE</span>

                    <span class="footer-wave" aria-hidden="true">〰</span>

                    <span class="footer-copyright">
                        © 2026 LOW TIDE
                    </span>

                </div>

            </div>

        </footer>

    </main>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
